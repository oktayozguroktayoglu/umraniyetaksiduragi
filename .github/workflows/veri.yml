name: Mahalle verilerini çek

# Yayından bağımsız çalışır; veri gelince repoya kaydeder, bu da siteyi yeniden yayınlar.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/enrich.mjs']
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write
  actions: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/enrich.mjs
      - name: Kaydet ve yayını tetikle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/mahalle-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Mahalle verileri güncellendi"
            git pull --rebase origin main
            git push
            gh workflow run deploy.yml --ref main
          fi
