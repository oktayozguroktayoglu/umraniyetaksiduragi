name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Mahalle verilerini OpenStreetMap’ten yeniden çek'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mahalle verilerini çek (OSM/OSRM)
        if: ${{ hashFiles('src/data/mahalle-data.json') == '' || inputs.refresh }}
        continue-on-error: true
        timeout-minutes: 25
        run: node scripts/enrich.mjs
      - name: Verileri repoya kaydet
        if: ${{ hashFiles('src/data/mahalle-data.json') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/mahalle-data.json
          git diff --cached --quiet || (git commit -m "Mahalle verileri güncellendi [skip ci]" && git pull --rebase origin main && git push)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
